name: Build & Publish Release APK

on:
  push:
    tags:
      - '*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Gradle:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: ⚙️ Generate/Update Android Prebuild
        run: npx expo prebuild --platform android --no-install

      - name: 🔑 Make Gradle executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: 🔨 Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: 🔍 Collect Generated APK
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/daily-tasks-release.apk \;
          echo "Built APK files:"
          ls -lh build-output/

      - name: 📤 Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-tasks-release-apk
          path: build-output/daily-tasks-release.apk

      - name: 🚀 Release APK on GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: build-output/daily-tasks-release.apk
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
