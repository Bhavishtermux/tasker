name: Build and Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ⚙️ Expo Prebuild (Generate Android Project)
        run: npx expo prebuild --platform android --no-install

      - name: 🔨 Build Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 🔍 Find and Rename APK
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/daily-tasks-release.apk \;
          echo "APK built successfully:"
          ls -lh build-output/

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-tasks-release-apk
          path: build-output/daily-tasks-release.apk
          retention-days: 30

      - name: 🚀 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/daily-tasks-release.apk
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
